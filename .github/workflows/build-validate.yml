name: build-validate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build-validate:
    name: build-validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create env file
        run: |
          touch .env.production
          echo TSDOWN_APP_NAME=${{ env.TSDOWN_APP_NAME }} >> .env.production
          echo TSDOWN_APP_DESCRIPTION=${{ env.TSDOWN_APP_DESCRIPTION }} >> .env.production
          echo TSDOWN_MODE=production >> .env.production
          cat .env.production

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 'latest'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Oxlint
        run: pnpm lint:fix

      - name: Run Oxfmt
        run: pnpm fmt:check

      - name: Run Tests
        run: pnpm test:run

      - name: Run Tests with coverage
        run: pnpm test:coverage

      - name: Build project
        run: pnpm build
